; Copia este archivo como config.ini y completa los datos.
; Las rutas relativas se toman desde la carpeta del proyecto.

[fuente]
archivo = data/sample/produccion_vinilos_anonimizado.xlsx  ; tus datos reales: data/raw/data_base_transformado.xlsx
hoja = 0                        ; índice o nombre de la hoja

[mysql]
host = localhost
puerto = 3306
usuario = etl_vinilos
password =                      ; mejor déjalo vacío y usa la variable de entorno MYSQL_PASSWORD
base_datos = temperas_vinilos

[reglas]
max_pacas_por_hora = 50         ; por encima se marca el turno como atípico (p99.5 real ≈ 41)

[ejecucion]
carpeta_logs = logs
carpeta_salida = salida
